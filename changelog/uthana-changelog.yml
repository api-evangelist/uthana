scheme: dated entries (Keep-a-Changelog style Added/Changed/Removed), model-versioned capabilities
current_models:
  text_to_motion: text-to-motion-3.0 (pay-as-you-go; async via create_text_to_motion_job)
  video_to_motion: video-to-motion-2.0 (default), video-to-motion-2.1 (refined)
