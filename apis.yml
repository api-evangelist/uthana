aid: uthana
name: Uthana
description: Uthana builds foundation models for human motion — generative AI that creates
  lifelike 3D character animation from text prompts, 2D reference video, or real-time
  input, instantly retargeted to any rig (with auto-rigging for unrigged characters).
  Founded in 2023, Uthana exposes its platform through a GraphQL API at uthana.com/graphql
  with official Python and JavaScript/TypeScript clients, React hooks, Blender and Maya
  plugins, ComfyUI nodes, and REST endpoints for downloading motions in FBX, GLB, BVH, and
  Unitree G1 CSV formats for games, film, AI-native platforms, and robotics.
