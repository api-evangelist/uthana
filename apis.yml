apis:
- name: Uthana GraphQL API
  description: Single GraphQL endpoint for the whole Uthana platform - text-to-motion,
    video-to-motion, locomotion, stitch/loop, character upload with auto-rigging, asset
    management, account, subscription, and pay-as-you-go billing operations. Public
    introspection; HTTP Basic auth with the API key as username.
  humanURL: https://uthana.com/docs/api
  baseURL: https://uthana.com/graphql
