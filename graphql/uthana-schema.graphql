type Query {
  """
  Logged-in user organization
  """
  org: Org
  """
  Logged-in user
  """
  user: User
  """
  Per-model PAYG billing rates
  """
  payg_prices: [PaygPrice!]
  """
  PAYG ledger entries for the logged-in user's org (most recent first)
  """
  payg_ledger(limit: Int = 50): [PaygLedgerEntry!]
  """
  All available locomotion styles
  """
  locomotion_styles: [String!]
  """
  Get a character
  """
  character(id: String): Character
  characters: [Character!]
  """
  Get a motion
  """
  motion(id: String): Motion
  """
  Motions available for logged-in user
  """
  motions(character_id: String, app_ids: [String!], methods: [String]): [Motion!]
  label_search(query: String, limit: Int = 20): [LabelSearchResult!]
  job(job_id: String): Job
  """
  Jobs available for logged-in user/org
  """
  jobs(method: String): [Job!]
  motion_downloads(user_id: String): [MotionDownload!]
  motion_download_summary(interval: String = "month"): [MotionDownloadSummary!]
  motion_download_allowed(character_id: String, motion_id: String): MotionDownloadAllowed
  motion_rating(motion_id: String!, label_id: String): MotionRating
  motion_favorite(motion_id: String!, label_id: String): MotionFavorite
  """
  Issue short-lived Deepgram token (TTL 120s)
  """
  deepgram_token: DeepgramToken
  """
  Start sunburst stats job and return job
  """
  sunburst(source: String = "labels"): Job
  """
  List of subscription plans
  """
  subscription_plans: [SubscriptionPlan!]
  """
  Logged-in user org's subscription
  """
  subscription: Subscription
  character_rtcc_retarget(src_character_id: String!, dst_character_id: String!): GenericScalar
}

